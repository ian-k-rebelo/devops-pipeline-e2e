# Shared entry point (platform): namespace, GatewayClass and Gateway, implemented by Envoy Gateway
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: devops-pipeline-e2e
---
# Which implementation handles Gateways of this class
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# The entry point: listens for HTTPS only (no plain HTTP) and accepts routes from the project's namespaces
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    # HTTPS on port 443: TLS is terminated here, with the certificate issued by the internal CA
    - name: https
      protocol: HTTPS
      port: 443
      hostname: app.devops-pipeline-e2e.internal
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: app-devops-pipeline-e2e-internal-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: devops-pipeline-e2e
