# CodeQL: static analysis (SAST) of the code we write, the Python of the repository and the GitHub
# Actions workflows (for example, script injection), with the security-extended queries. The
# results go to the Security tab (code scanning). The ruleset protect-main blocks a merge when the
# pull request adds an alert of high severity or more (code scanning merge protection), so this
# is not a required check: the analysis passes even when it finds something.
# Runs on every pull request, on every push to main, and every week: new queries can find
# problems in code that did not change (docs/ci-security.md, section 2).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Every Monday at 04:17 UTC, so that new alerts are there for the Monday review
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# No permissions by default: the job asks only for what it needs
permissions: {}

# A new push to the same branch cancels the analysis that is still going
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read the code, and upload the results to code scanning
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python and workflows are analysed from the source: nothing is built
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
