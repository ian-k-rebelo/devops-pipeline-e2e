# Continuous integration: test the application, then build, smoke test and scan its
# container image on every pull request; on pushes to main and version tags, also publish it
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Version tags (v1.2.3) publish the image with its semantic version
    tags: ["v*"]

# Least privilege: by default, every job can only read the repository
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      # Get the repository code; the token is not left on disk after the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python minor version as the container image (python:3.12)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  image:
    name: Image
    # Only build the image when the tests pass
    needs: test
    runs-on: ubuntu-24.04
    # Passed to the Publish job: the digest of the exact image that was tested, and its registry tags
    outputs:
      digest: ${{ steps.archive.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit builder, able to use the GitHub Actions cache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Image name, tags and labels: sha-<commit> and main on main;
      # X.Y.Z and X.Y on version tags; never latest.
      # The labels are part of the image, so they are added here, in the only build
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once: load the image into the runner's Docker for the tests below,
      # and save the same build as an OCI archive for the Publish job.
      # provenance: false: no unsigned BuildKit attestation, so the image is a single manifest
      # (the signed provenance is created by the Publish job); layers are cached between runs
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: false
          load: true
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: devops-pipeline-e2e:ci
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove that the image in Docker (tested below) and the archive (published later) are the same:
      # same config digest (the image ID). Then read the image digest from the archive
      - name: Check archive and read digest
        id: archive
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          INDEX="$(tar -xOf "${ARCHIVE}" index.json)"
          test "$(echo "${INDEX}" | jq '.manifests | length')" = "1"
          test "$(echo "${INDEX}" | jq -r '.manifests[0].mediaType')" = "application/vnd.oci.image.manifest.v1+json"
          DIGEST="$(echo "${INDEX}" | jq -r '.manifests[0].digest')"
          ARCHIVE_CONFIG="$(tar -xOf "${ARCHIVE}" "blobs/sha256/${DIGEST#sha256:}" | jq -r '.config.digest')"
          LOADED_ID="$(docker image inspect devops-pipeline-e2e:ci --format '{{.Id}}')"
          echo "Image digest:     ${DIGEST}"
          echo "Archive config:   ${ARCHIVE_CONFIG}"
          echo "Tested image ID:  ${LOADED_ID}"
          test "${ARCHIVE_CONFIG}" = "${LOADED_ID}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # Smoke test: the container starts and answers on /health within 10 seconds
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 devops-pipeline-e2e:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      # Vulnerability scan: fail on HIGH or CRITICAL vulnerabilities that already have a fix;
      # Trivy is pinned by digest because its releases were compromised in March 2026.
      # The image is read from .github/trivy/Dockerfile, so Dependabot can keep it up to date
      - name: Scan image for vulnerabilities
        run: |
          TRIVY_IMAGE="$(sed -n 's/^FROM //p' .github/trivy/Dockerfile)"
          test -n "${TRIVY_IMAGE}"
          echo "Trivy image: ${TRIVY_IMAGE}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "${TRIVY_IMAGE}" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            devops-pipeline-e2e:ci

      # Keep the tested image for the Publish job; only reached when every check above passed.
      # Kept for one day; the layers are already compressed, so no compression here
      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish
    # Only publish an image that was built, smoke tested and scanned
    needs: image
    # Only on pushes to main and version tags, never on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Only this job can write to the GitHub Container Registry and sign attestations
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Digest of the image tested by the Image job: the only image this job pushes and signs
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # The repository is only needed for .github/trivy/Dockerfile (Generate SBOM)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image archive tested by the Image job, no rebuild here;
      # the download fails if the file does not match the one that was uploaded
      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      # Before logging in: the archive must hold the tested image (same digest)
      - name: Check archive digest
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          ARCHIVE_DIGEST="$(tar -xOf "${ARCHIVE}" index.json | jq -r '.manifests[0].digest')"
          echo "Tested digest:  ${DIGEST}"
          echo "Archive digest: ${ARCHIVE_DIGEST}"
          test -n "${DIGEST}"
          test "${ARCHIVE_DIGEST}" = "${DIGEST}"

      # Log in with the short-lived token GitHub creates for this run; no stored secrets
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the tested image as it is, once per tag; skopeo (preinstalled on the runner)
      # uses the login above, and --preserve-digests fails instead of changing the digest
      - name: Push image
        env:
          ARCHIVE: ${{ runner.temp }}/image.tar
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          for TAG in ${TAGS}; do
            echo "Pushing ${TAG}"
            skopeo copy --preserve-digests "oci-archive:${ARCHIVE}" "docker://${TAG}"
          done

      # Every tag in the registry must point to the tested image
      - name: Check registry digest
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          for TAG in ${TAGS}; do
            REMOTE_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${TAG}")"
            echo "${TAG} -> ${REMOTE_DIGEST}"
            test "${REMOTE_DIGEST}" = "${DIGEST}"
          done

      # Signed provenance: proves this image (by digest) was built by this workflow, from this commit.
      # Keyless signing with a short-lived Sigstore certificate; stored in GitHub and next to the image in GHCR
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          # Storage records are only available for organization-owned repositories
          create-storage-record: false

      # SBOM: the list of every package in the published image, generated by the pinned Trivy
      - name: Generate SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
        run: |
          TRIVY_IMAGE="$(sed -n 's/^FROM //p' .github/trivy/Dockerfile)"
          test -n "${TRIVY_IMAGE}"
          docker run --rm \
            -v "${PWD}:/out" \
            "${TRIVY_IMAGE}" \
            image --format cyclonedx --output /out/sbom.cdx.json --no-progress \
            "${IMAGE}"

      # Signed SBOM attestation: ties this list of packages to this exact image
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
