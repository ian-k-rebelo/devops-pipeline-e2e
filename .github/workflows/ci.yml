# Continuous integration: run the application tests on every pull request and on every push to main
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: by default, every job can only read the repository
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      # Get the repository code; the token is not left on disk after the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python minor version as the container image (python:3.12)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
