# Continuous integration: test the application, then build, smoke test and scan its
# container image on every pull request; on pushes to main and version tags, also publish it
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Version tags (v1.2.3) publish the image with its semantic version
    tags: ["v*"]

# Least privilege: by default, every job can only read the repository
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      # Get the repository code; the token is not left on disk after the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python minor version as the container image (python:3.12)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  image:
    name: Image
    # Only build the image when the tests pass
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit builder, able to use the GitHub Actions cache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the image from app/ (not published yet) and load it into the runner's Docker;
      # layers are cached between runs, so unchanged steps are not rebuilt
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: false
          load: true
          tags: devops-pipeline-e2e:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the container starts and answers on /health within 10 seconds
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 devops-pipeline-e2e:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      # Vulnerability scan: fail on HIGH or CRITICAL vulnerabilities that already have a fix;
      # Trivy is pinned by digest because its releases were compromised in March 2026
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            devops-pipeline-e2e:ci

  publish:
    name: Publish
    # Only publish an image that was built, smoke tested and scanned
    needs: image
    # Only on pushes to main and version tags, never on pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Only this job can write to the GitHub Container Registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Image name, tags and labels: sha-<commit> and main on main;
      # X.Y.Z and X.Y on version tags; never latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Log in with the short-lived token GitHub creates for this run; no stored secrets
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild from the cache written by the Image job (same layers) and push
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
