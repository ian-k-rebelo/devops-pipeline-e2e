# Dependabot version updates: weekly, only for releases at least 7 days old (cooldown).
# Security updates are enabled in the repository settings and are not delayed by the cooldown.
version: 2
updates:
  # Python libraries in app/requirements.txt and app/requirements-dev.txt
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Minor and patch updates together in one pull request; each major update on its own
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Base image of the application (app/Dockerfile)
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Stay on the current Python minor version (3.12): moving to a new one is a planned change,
    # made together with the Python version used by the CI tests
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope

  # Trivy image used by the CI and the scheduled scan (tools/trivy/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/trivy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Syft image used by the CI to generate the SBOM (tools/syft/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/syft
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Grype image used by the CI and the scheduled scan to scan the SBOM (tools/grype/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/grype
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # jq image: the CI and the local setup take jq from it (tools/jq/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release;
  # after merging, run .github/scripts/install-jq.sh ~/.local/bin to keep the local jq equal to the CI
  - package-ecosystem: docker
    directory: /tools/jq
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # hadolint image: lints the Dockerfiles (tools/hadolint/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/hadolint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # ShellCheck image: lints the shell scripts (tools/shellcheck/Dockerfile).
  # ShellCheck publishes no signatures: Verify tool images compares the image with the release
  - package-ecosystem: docker
    directory: /tools/shellcheck
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Go toolchain image that builds the Go tools (tools/golang/Dockerfile)
  - package-ecosystem: docker
    directory: /tools/golang
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Go tools (actionlint, kubeconform, kustomize) in tools/go/go.mod; the Go toolchain checks
  # every module against tools/go/go.sum and the public Go checksum database
  - package-ecosystem: gomod
    directory: /tools/go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
