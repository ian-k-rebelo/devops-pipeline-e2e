# Dependabot version updates: weekly, only for releases at least 7 days old (cooldown).
# Security updates are enabled in the repository settings and are not delayed by the cooldown.
version: 2
updates:
  # Python libraries in app/requirements.txt and app/requirements-dev.txt
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Minor and patch updates together in one pull request; each major update on its own
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Base image of the application (app/Dockerfile)
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Stay on the current Python minor version (3.12): moving to a new one is a planned change,
    # made together with the Python version used by the CI tests
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope

  # Trivy image used by the CI and the scheduled scan (tools/trivy/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/trivy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Syft image used by the CI to generate the SBOM (tools/syft/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/syft
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Grype image used by the CI and the scheduled scan to scan the SBOM (tools/grype/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/grype
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # jq image: the CI and the local setup take jq from it (tools/jq/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release;
  # after merging, run .github/scripts/install-jq.sh ~/.local/bin to keep the local jq equal to the CI
  - package-ecosystem: docker
    directory: /tools/jq
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # hadolint image: lints the Dockerfiles (tools/hadolint/Dockerfile).
  # The required check Verify tool images verifies each update against the signed release
  - package-ecosystem: docker
    directory: /tools/hadolint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # ShellCheck image: lints the shell scripts (tools/shellcheck/Dockerfile).
  # ShellCheck publishes no signatures: Verify tool images compares the image with the release
  - package-ecosystem: docker
    directory: /tools/shellcheck
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Go toolchain image that builds the Go tools (tools/golang/Dockerfile)
  - package-ecosystem: docker
    directory: /tools/golang
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Go tools (actionlint, kubeconform, kustomize) in tools/go/go.mod; the Go toolchain checks
  # every module against tools/go/go.sum, and .github/scripts/check-go-sum.sh checks go.sum
  # against the public Go checksum database
  - package-ecosystem: gomod
    directory: /tools/go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # The tools are "// indirect" in go.mod (the tool directive requires them, no code imports
    # them), and Dependabot only updates direct dependencies by default. An allow list replaces
    # that default, so its first rule keeps it: no version updates for the libraries (none is a
    # direct dependency) and security updates for all of them (security updates do not check the
    # dependency type). The other rules add each tool by name, of any type. Tested in a test
    # repository: docs/ci-security.md, section 3 (Go tools)
    allow:
      - dependency-type: direct
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
      - dependency-name: github.com/yannh/kubeconform
        dependency-type: all
      - dependency-name: sigs.k8s.io/kustomize/kustomize/v5
        dependency-type: all
    commit-message:
      prefix: ci
      include: scope

  # helm in tools/helm/go.mod, which renders the CRDs for update-k8s-schemas.sh: a module of its
  # own, so that its many dependencies never change the versions used by the tools of tools/go
  - package-ecosystem: gomod
    directory: /tools/helm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # The same allow rules as /tools/go (see there), for helm
    allow:
      - dependency-type: direct
      - dependency-name: helm.sh/helm/v4
        dependency-type: all
    commit-message:
      prefix: ci
      include: scope

  # Python image that runs the CRD converter of update-k8s-schemas.sh (tools/python/Dockerfile).
  # Stay on Python 3.14: PyYAML must publish wheels for a new minor version first
  - package-ecosystem: docker
    directory: /tools/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: ci
      include: scope

  # PyYAML for the CRD converter (tools/python/requirements.txt), pinned by version and hash
  - package-ecosystem: pip
    directory: /tools/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
