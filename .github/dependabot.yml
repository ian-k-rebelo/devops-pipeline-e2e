# Dependabot version updates: weekly, only for releases at least 7 days old (cooldown).
# Security updates are enabled in the repository settings and are not delayed by the cooldown.
version: 2
updates:
  # Python libraries in app/requirements.txt and app/requirements-dev.txt
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Minor and patch updates together in one pull request; each major update on its own
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Base image of the application (app/Dockerfile)
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    # Stay on the current Python minor version (3.12): moving to a new one is a planned change,
    # made together with the Python version used by the CI tests
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
      include: scope

  # Trivy image used by the CI scan (.github/trivy/Dockerfile)
  - package-ecosystem: docker
    directory: /.github/trivy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # Syft image used by the CI to generate the SBOM (.github/syft/Dockerfile).
  # The image is not signed: before merging an update, check that its binary matches
  # the signed release (cosign verify-blob on the checksums, then compare the sha256)
  - package-ecosystem: docker
    directory: /.github/syft
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
