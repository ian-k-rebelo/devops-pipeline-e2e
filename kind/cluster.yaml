# Local Kubernetes cluster for development, created with kind
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-pipeline-e2e

# One control plane and two workers, with a fixed Kubernetes version (image tag and digest)
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
