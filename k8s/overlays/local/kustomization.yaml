# Local environment (kind): the application base with a locally built image
# scripts/deploy-local.sh replaces the "local" tag below with a unique tag per build (commit + image content)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: devops-pipeline-e2e
    newTag: local
